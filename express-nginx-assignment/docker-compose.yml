services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - express-app
    networks:
      - app-network

  express-app:
    build: .
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
