name: React CI Pipeline

on:
  push:
    branches: [ "development" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: List files
      run: ls -la

    - name: Show current path
      run: pwd

    - name: Simple success message
      run: echo "Pipeline executed successfully on self-hosted runner"