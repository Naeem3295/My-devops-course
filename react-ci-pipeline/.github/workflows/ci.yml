name: React CI Pipeline

on:
  push:
    branches: [ "development" ]

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./react-ci-pipeline

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Build the app
      run: echo "Build completed successfully!"