name: Deploy Backend with Observability

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd app/backend && npm install
      - name: Run tests
        run: cd app/backend && npm test || echo "No tests yet"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~
            if [ -d "module-7-observability" ]; then
              cd module-7-observability && git pull
            else
              git clone https://github.com/Naeem3295/My-devops-course.git module-7-observability
              cd module-7-observability
            fi
            cd app/backend
            npm install
            pkill node || true
            npm start &
